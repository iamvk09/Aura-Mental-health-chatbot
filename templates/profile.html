<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - AURA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid white;
            background: rgba(255,255,255,0.2);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .content {
            padding: 30px;
        }

        .profile-section {
            margin-bottom: 30px;
        }

        .profile-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .user-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
        }

        .history-section {
            margin-top: 30px;
        }

        .history-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #666;
            font-size: 14px;
        }

        .history-messages {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
        }

        .bot-bubble {
            background: white;
            border: 1px solid #e0e0e0;
            align-self: flex-start;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 User Profile</h1>
            <div class="header-buttons">
                <a href="/" class="btn">Back to Chat</a>
                <button onclick="handleLogout()" class="btn">Logout</button>
            </div>
        </div>

        <div class="content">
            <div class="profile-section">
                <h2>Account Information</h2>
                <div class="user-info" id="userInfo">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="profile-section history-section">
                <h2>Chat History</h2>
                <div id="chatHistory">
                    <div class="loading">Loading chat history...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                // Load user info and history
                const response = await fetch('/history');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Display user info
                    const userInfoDiv = document.getElementById('userInfo');
                    userInfoDiv.innerHTML = `
                        <div class="info-item">
                            <span class="info-label">Username:</span>
                            <span class="info-value">${data.username || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Total Conversations:</span>
                            <span class="info-value">${data.history ? data.history.length : 0}</span>
                        </div>
                    `;
                    
                    // Display chat history
                    const historyDiv = document.getElementById('chatHistory');
                    if (data.history && data.history.length > 0) {
                        let historyHTML = '';
                        data.history.forEach((conv, index) => {
                            const date = new Date(conv.timestamp);
                            const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                            
                            historyHTML += `
                                <div class="history-item">
                                    <div class="history-header">
                                        <span>Conversation #${data.history.length - index}</span>
                                        <span>${dateStr}</span>
                                    </div>
                                    <div class="history-messages">
                                        <div class="message-bubble user-bubble">
                                            ${conv.user_message.replace(/\n/g, '<br>')}
                                        </div>
                                        <div class="message-bubble bot-bubble">
                                            ${conv.bot_response.replace(/\n/g, '<br>')}
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        historyDiv.innerHTML = historyHTML;
                    } else {
                        historyDiv.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">💬</div>
                                <p>No chat history yet. Start a conversation in the chat!</p>
                            </div>
                        `;
                    }
                } else {
                    // Not authenticated
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('userInfo').innerHTML = '<div class="empty-state">Error loading profile</div>';
                document.getElementById('chatHistory').innerHTML = '<div class="empty-state">Error loading chat history</div>';
            }
        }

        async function handleLogout() {
            try {
                await fetch('/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/';
            }
        }

        // Load profile on page load
        loadProfile();
    </script>
</body>
</html>
